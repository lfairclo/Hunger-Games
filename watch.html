<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE ARENA — Watch Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="watch-body">

<header class="watch-header">
  <div class="brand-mark" style="font-size:20px;">THE <span>ARENA</span></div>
  <div class="watch-header-stats" id="watchStats">
    <span class="live-pill" id="livePill"><span class="pulse-dot"></span>—</span>
    <span id="statPhase">—</span>
    <span id="statAlive">—</span>
    <span id="statUpdated">—</span>
  </div>
</header>

<div id="announcementBanner" class="announcement-banner" style="display:none;"></div>

<main class="watch-main">

  <div class="empty-state" id="noGameState" style="display:none; padding:100px 20px;">
    <div style="font-family:var(--font-display); font-size:24px; color:var(--bone); margin-bottom:8px;">No Game Active</div>
    <div>Check back later, or ask the host to start one.</div>
  </div>

  <div id="liveContent" style="display:none;">
    <div class="winner-banner" id="watchWinnerBanner" style="display:none;"></div>

    <div class="arena-layout">
      <div>
        <div class="map-wrap" style="margin-bottom:20px;">
          <svg class="map-svg" id="mapSvg" viewBox="0 0 100 100"></svg>
        </div>
        <h2 style="font-family:var(--font-display); font-size:14px; color:var(--muted); margin:0 0 10px;">LATEST EVENTS</h2>
        <div class="feed" id="feed" style="max-height:50vh;"></div>
      </div>
      <div>
        <h2 style="font-family:var(--font-display); font-size:14px; color:var(--muted); margin:0 0 10px;">TRIBUTES</h2>
        <div class="roster-strip" id="rosterStrip"></div>
      </div>
    </div>
  </div>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script src="data.js"></script>
<script src="avatars.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="firebase-client.js"></script>
<script type="module" src="watch.js"></script>
</body>
</html>
