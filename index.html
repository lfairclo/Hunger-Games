<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Portal</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap">
  <h1>GAME PORTAL</h1>
  <div class="card" id="loginBox" style="display:none;">
    <p class="desc">Sign in with your Google account to continue.</p>
    <button id="googleBtn">Sign in with Google</button>
    <p class="error" id="statusText"></p>
  </div>
  <div class="card" id="pendingBox" style="display:none;">
    <p class="desc" id="pendingText"></p>
    <button id="signOutBtn">Sign out</button>
  </div>
  <div class="card" id="checkingBox">
    <p class="desc">Checking...</p>
  </div>
</div>
<div id="escReminder"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/session.js"></script>
<script src="shared/time-gate.js"></script>
<script src="shared/esc-bosskey.js"></script>
<script>
document.getElementById('escReminder').textContent =
  '⚠ Press ESC at any time to instantly leave this page (opens Google Classroom).';

// Time gate applies before anything else, including the login screen itself.
if (window.SchoolSim.enforceTimeGate()) {
  window.SchoolSim.initSessionExpiry();

  const loginBox = document.getElementById('loginBox');
  const pendingBox = document.getElementById('pendingBox');
  const checkingBox = document.getElementById('checkingBox');
  const statusText = document.getElementById('statusText');

  function showOnly(el) {
    [loginBox, pendingBox, checkingBox].forEach(x => x.style.display = 'none');
    el.style.display = 'block';
  }

  document.getElementById('googleBtn').addEventListener('click', function () {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(function () {
      window.SchoolSim.markLoginNow();
    }).catch(function (err) {
      statusText.textContent = 'Sign-in failed: ' + err.message;
    });
  });

  document.getElementById('signOutBtn').addEventListener('click', function () {
    auth.signOut();
  });

  auth.onAuthStateChanged(function (user) {
    if (!user) { showOnly(loginBox); return; }
    showOnly(checkingBox);
    const userRef = db.collection('users').doc(user.uid);
    userRef.get().then(function (doc) {
      if (!doc.exists) {
        return userRef.set({
          email: user.email,
          displayName: user.displayName || '',
          approved: false,
          requestedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () { return userRef.get(); });
      }
      return doc;
    }).then(function (doc) {
      const data = doc.data();
      if (!data || data.approved !== true) {
        document.getElementById('pendingText').textContent =
          'Your account (' + user.email + ') is waiting for approval.';
        showOnly(pendingBox);
        return;
      }
      window.location.replace('lobby.html');
    }).catch(function (err) {
      statusText.textContent = 'Error: ' + err.message;
      showOnly(loginBox);
    });
  });
}
</script>
</body>
</html>
